name: New Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g., 0.1.0"
        required: true
        default: "0.1.0"
      changelog:
        description: "Release notes, markdown"
        required: false
        default: ""
      
      publish_to_pypi:
        description: "Publish to PyPI"
        required: true
        type: boolean
        default: true
      create_github_release:
        description: "Publish as GitHub Release"
        required: true
        type: boolean
        default: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Update version in setup.py and pyproject.toml
      run: |
        sed -i "s/version=\"[0-9.]*\"/version=\"${{ github.event.inputs.version }}\"/" setup.py
        sed -i "s/version = \"[0-9.]*\"/version = \"${{ github.event.inputs.version }}\"/" pyproject.toml

    - name: Build package
      run: python -m build

    - name: Publish to PyPI
      if: ${{ github.event.inputs.publish_to_pypi == 'true' }}
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: twine upload dist/*

    - name: Create GitHub Release
      if: ${{ github.event.inputs.create_github_release == 'true' }}
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.event.inputs.version }}
        name: Release v${{ github.event.inputs.version }}
        body: ${{ github.event.inputs.changelog }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: dist/*.whl
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
